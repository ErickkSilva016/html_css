<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto1</title>
</head>
<body>
    <h1>Matrícula - Escola Online</h1>

    <form method="post">
        <fieldset>
            <legend>Dados Pessoais</legend>
            <label for="nome_completo">Nome Completo</label>
            <input type="text" id="nome_completo" name="nome_completo" required><br><br>

            <label for="data_nasc">Data de Nascimento</label>
            <input type="date" id="data_nasc" name="data_nasc" required><br><br>

            <label for="email_aluno">E-mail do Aluno</label>
            <input type="email" id="email_aluno" name="email" placeholder="aluno@exemplo.com" required><br><br>

            <label for="senha">Senha de Acesso</label>
            <input type="password" id="senha" name="senha" min="5" max="8" placeholder="********" required><br><br>

            <label for="tel">Telefone de Emergência</label>
            <input type="tel" id="tel" name="telefone" placeholder="(00)-00000-0000"><br><br>
        </fieldset>

  
    
        <fieldset>
            <legend>Preferências de Estudo</legend>
            <p>Áreas de Interesse:</p>
            <input type="checkbox" id="front" name="area" value="front">
            <label for="front">Front-end</label><br>

            <input type="checkbox" id="back" name="area" value="back">
            <label for="back">Back-end</label><br>

            <input type="checkbox" id="desi" name="area" value="desi">
            <label for="desi">Design</label><br>

            <input type="checkbox" id="dados" name="area" value="dados">
            <label for="dados">Dados</label><br><br>
            
            <label for="indicacao">Como conheceu a escola?</label>
            <select id="indicacao" name="esc">
                <option value="indi">Indicação</option>
                <option value="search">Pesquisei</option>
                <option value="select">Fui selecionado</option>
            </select>
        </fieldset>
        <br>
        <button type="submit">Matricular</button>
        <button type="reset">Limpar</button>
    </form>

</body>
</html>
