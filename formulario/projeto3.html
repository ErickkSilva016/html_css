<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto3</title>
</head>
<body>
    <h1>Cotação de Seguro de Veículo</h1>
    <form method="post">
        <fieldset>
            <legend>Condutor</legend>
            <label for="nome_do_condu">Nome do Proprietario</label>
            <input type="text" id="nome_do_condu" name="nome"><br><br>

            <label for="cnh">CNH</label>
            <input type="number" id="cnh" name="cnh"><br><br>

            <label for="emissao">Data de Emissão da CNH</label>
            <input type="date" id="data_emiss" name="data"><br><br>

            <input type="radio" id="solt" name="estado" value="solt">
            <label for="solt">Solteiro</label>

            <input type="radio" id="cas" name="estado" value="cas">
            <label for="cas">Casado</label>

            <input type="radio" id="divo" name="estado" value="divo">
            <label for="divo">Divorciado</label>

            <input type="radio" id="viuvo" name="estado" value="viuvo">
            <label for="viuvo">Viúvo</label>
        </fieldset>


        <fieldset>
            <legend>Veículo</legend>
            <label for="placa">Placa do Carro</label>
            <input type="text" id="placa" name="placa" placeholder="ABC-1234"><br><br>

            <label for="marca">Marca do Veiculo</label>
            <select id="marca" name="marca">
                <option value="Fiat">Fiat</option>
            </select><br><br>
            <label for="ano">Ano do modelo</label>
            <input type="text" id="ano" name="ano">
        </fieldset>

            
        <fieldset>
            <legend>Uso</legend>
            <label>Usa o carro para trabalho(Uber/Taxi)?</label><br><br>
            <input type="radio" id="s/s" name="uso" value="sim">
            <label for="s/s">Sim</label>            
            
            <input type="radio" id="n/n" name="uso" value="sim">
            <label for="n/n">Não</label><br><br>
            

            <input type="checkbox" id="produt" name="produt" value="possui">
            <label for="produt">Possui rastreador instalado</label>
            
        </fieldset><br>
        <button type="submit">Solicitar Cotação</button>
    </form>
</body>
</html>
